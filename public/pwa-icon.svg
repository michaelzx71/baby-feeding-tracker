<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3"/>
      <stop offset="50%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#f3e8ff"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Baby Bottle Body -->
  <g transform="translate(156, 100)">
    <!-- Bottle Nipple -->
    <ellipse cx="100" cy="30" rx="40" ry="25" fill="#fef3c7"/>
    <path d="M70 35 Q100 10 130 35 L130 55 Q100 30 70 55 Z" fill="#fde68a"/>
    
    <!-- Bottle Cap Ring -->
    <rect x="60" y="55" width="80" height="20" rx="5" fill="#fbbf24"/>
    
    <!-- Bottle Body -->
    <rect x="50" y="75" width="100" height="200" rx="15" fill="white" stroke="#e5e7eb" stroke-width="3"/>
    
    <!-- Milk -->
    <rect x="55" y="120" width="90" height="145" rx="10" fill="url(#bottleGrad)" opacity="0.9"/>
    
    <!-- Measurement lines -->
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="70" y1="140" x2="85" y2="140"/>
      <line x1="70" y1="170" x2="90" y2="170"/>
      <line x1="70" y1="200" x2="85" y2="200"/>
      <line x1="70" y1="230" x2="90" y2="230"/>
    </g>
    
    <!-- Heart decoration -->
    <path d="M130 180 C130 165 115 155 100 170 C85 155 70 165 70 180 C70 200 100 220 100 220 C100 220 130 200 130 180 Z" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Star decorations -->
  <circle cx="80" cy="120" r="10" fill="#fbbf24" opacity="0.7"/>
  <circle cx="430" cy="150" r="8" fill="#a78bfa" opacity="0.7"/>
  <circle cx="420" cy="380" r="12" fill="#f472b6" opacity="0.7"/>
  <circle cx="70" cy="400" r="9" fill="#60a5fa" opacity="0.7"/>
</svg>
